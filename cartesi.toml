# Cartesi Machine configuration for the CMA Rust Wallet demo.
#
# Two drives:
#   - root     : the application + OS, built from the Dockerfile (pmem0)
#   - accounts : a raw, unformatted fixed-size flash drive that libcma opens as the single-asset
#                balance ledger via `Ledger::init_single_from_file("/dev/pmem1", ...)` (pmem1).
#
# Read by `cartesi build` / `cartesi run`. See:
# docs/cartesi-rollups_versioned_docs/version-2.0/development/advanced-configuration.md

# SDK provides cartesi-machine 0.20.0 (matches the host install used across this
# workspace and required by the emergency-withdrawal tooling). cartesi-machine 0.20.0
# uses the flash-drive option `data_filename` (renamed from `filename`, upstream commit
# 1c9388f). Build with @cartesi/cli >= 2.0.0-alpha.35, which emits `data_filename`
# natively — the older alpha.34 emitted the legacy `filename` and needed a patched CLI.
sdk = "cartesi/sdk:0.12.0-alpha.41"

[machine]
ram_length = "128Mi"
# entrypoint + workdir + env come from the Dockerfile (ENTRYPOINT ["cma-rust-wallet"]).
use_docker_env = true
use_docker_workdir = true
# Compute the machine hash after build (needed for on-chain deployment / verification).
final_hash = true

# --- Root drive: OS + the wallet binary (built from the Dockerfile) -> /dev/pmem0 ---
[drives.root]
builder = "docker"
dockerfile = "Dockerfile"
format = "ext2"

# --- Accounts drive: raw 4 MiB flash drive for the libcma single-asset ledger -> /dev/pmem1 ---
# `builder = "empty"` + `format = "raw"` produces a zero-filled, UNFORMATTED drive (the CLI
# equivalent of cartesi-machine's `mke2fs:false`). The app opens the block device directly
# (no filesystem), so `mount = false`.
#
# Single-asset layout: libcma writes a 4096-entry array of 32-byte balance records at the
# START of the drive (4096 * 32 B = 128 KiB = 2^17 bytes — the PROVEN records prefix), then
# keeps its heap index maps in the remaining space. So the drive is 4 MiB (plenty of heap
# room) but the accounts-drive Merkle proof covers only the first 128 KiB:
# log2_leaves_per_account = 0 (a 32-byte leaf), log2_max_num_of_accounts = 12 (2^12 = 4096
# records). The heap is deliberately OUTSIDE the proven region — its map nodes contain owner
# addresses that would otherwise false-match the prover's by-address account scan.
[drives.accounts]
builder = "empty"
format = "raw"
# Size in BYTES. 4194304 = 4 MiB, a multiple of the 4096-byte flash-drive page size, sized to
# hold the 128 KiB records prefix plus libcma's heap maps. (The CLI's size parser doesn't
# understand a "4Mi" suffix — it would read just `4` and produce a 4-byte drive.)
size = 4194304
mount = false
user = "dapp"

# --- Emergency-withdrawal config -------------------------------------------------------
# The devnet deploys with these via `cartesi-rollups-cli deploy --withdrawal-config-file
# devnet/withdrawal.json` (see the README). This block is the equivalent for an all-in-one
# `cartesi run`; keep it in sync with devnet/withdrawal.json.
#
# `accounts_drive_start_index` = (drive machine-memory start) / (proven region size). The
# region is 2^(5 + log2_max_num_of_accounts + log2_leaves_per_account) = 2^(5+12+0) = 2^17 =
# 131072 bytes (the 128 KiB records prefix). The drive lands at 0x90000000000000, so the
# index is 0x90000000000000 / 131072 = 309237645312. Verify against the built image with:
#   jq -r '.config.flash_drive[] | select(.length==4194304) | (.start/131072|floor)' .cartesi/image/config.json
#
# [withdrawal.config]
# guardian = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
# log2_leaves_per_account = 0
# log2_max_num_of_accounts = 12
# accounts_drive_start_index = 309237645312   # = 0x90000000000000 / 2^17; verify via config.json
# withdrawal_output_builder = "0x0745787835A019cd4dae8EDB541Fbc0647793d63"
